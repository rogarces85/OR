{% extends "base.html" %}

{% block titulo %}{{ codigo }} · {{ app_name }}{% endblock %}

{% block contenido %}
<section class="mx-auto max-w-3xl px-4 py-20 text-center">
  <p class="text-6xl font-bold text-marca-rojo">{{ codigo }}</p>
  <h1 class="mt-4 text-2xl font-semibold">{{ titulo }}</h1>
  <p class="mt-2 text-gray-700">{{ mensaje }}</p>
  <p class="mt-8">
    <a href="/" class="inline-block rounded bg-marca-negro px-4 py-2 font-medium text-marca-blanco transition-colors hover:bg-gray-800">
      Volver al inicio
    </a>
  </p>
</section>
{% endblock %}
