{% extends "base.html" %}

{% block titulo %}Ingresar · {{ app_name }}{% endblock %}

{% block contenido %}
<div class="mx-auto flex max-w-md flex-col px-4 py-16">
  <h1 class="text-2xl font-bold">Ingresar</h1>
  <p class="mt-2 text-sm text-gray-600">
    Accede con el correo y la contraseña que te entregó el club.
  </p>

  <div class="mt-6">
    {% include "parciales/alertas.html" %}
  </div>

  <form method="post" action="/ingresar" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div>
      <label for="email" class="block text-sm font-medium">Correo electrónico</label>
      <input id="email" name="email" type="email" required autocomplete="username"
             value="{{ email or '' }}"
             class="mt-1 w-full rounded border border-gray-300 px-3 py-2 focus:border-marca-rojo focus:outline-none">
    </div>

    <div>
      <label for="password" class="block text-sm font-medium">Contraseña</label>
      <input id="password" name="password" type="password" required
             autocomplete="current-password"
             class="mt-1 w-full rounded border border-gray-300 px-3 py-2 focus:border-marca-rojo focus:outline-none">
    </div>

    <button type="submit"
            class="w-full rounded bg-marca-rojo px-4 py-2 font-medium text-marca-blanco transition-colors hover:bg-red-700">
      Ingresar
    </button>
  </form>

  <a href="/" class="mt-6 text-sm text-gray-600 transition-colors hover:text-marca-rojo">
    ← Volver al inicio
  </a>
</div>
{% endblock %}
