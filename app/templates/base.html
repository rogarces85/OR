<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/app.css') }}">
  <script defer src="{{ request.url_for('static', path='js/alpine.min.js') }}"></script>
</head>
<body class="min-h-screen flex flex-col bg-marca-blanco text-marca-negro">
  {% block encabezado %}{% include "parciales/encabezado.html" %}{% endblock %}

  <main class="flex-1">
    {% block contenido %}{% endblock %}
  </main>

  {% block pie %}{% include "parciales/pie.html" %}{% endblock %}
</body>
</html>
